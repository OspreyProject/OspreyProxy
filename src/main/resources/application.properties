# ---------------------------------------------
# Server config
# ---------------------------------------------
server.address=127.0.0.1
# Do NOT let Spring trust X-Forwarded-* headers automatically;
# Nginx is the only trusted intermediary and sets X-Real-IP directly.
server.forward-headers-strategy=NONE
server.max-http-request-header-size=8KB
server.server-header=
# ---------------------------------------------
# Tomcat config
# ---------------------------------------------
server.tomcat.connection-timeout=5000
server.tomcat.keep-alive-timeout=10000
server.tomcat.max-http-form-post-size=10KB
server.tomcat.max-keep-alive-requests=1000
server.tomcat.max-swallow-size=10240
# ---------------------------------------------
# Spring MVC config
# ---------------------------------------------
spring.main.banner-mode=off
# Must be SERVLET for Spring MVC, not REACTIVE
spring.main.web-application-type=SERVLET
spring.mvc.async.request-timeout=15000
spring.mvc.problemdetails.enabled=false
spring.output.ansi.enabled=NEVER
spring.servlet.multipart.enabled=false
spring.servlet.multipart.max-file-size=10KB
spring.servlet.multipart.max-request-size=10KB
spring.threads.virtual.enabled=true
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.whitelabel.enabled=false
spring.web.resources.add-mappings=false
# ---------------------------------------------
# Actuator config
# Expose only health + prometheus on a separate internal-only port (9090).
# The main server.port stays on 127.0.0.1 and is Nginx-facing.
# Nginx should NOT proxy /actuator - bind management to a port only reachable locally.
# ---------------------------------------------
management.server.port=9090
management.server.address=127.0.0.1
management.endpoints.access.default=none
management.endpoint.health.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# Prevents actuator from adding its own error page mappings
management.endpoints.web.base-path=/actuator
# ---------------------------------------------
# /check aggregator (public URL scanner on osprey.ac/check)
# ---------------------------------------------
# The single web origin allowed to call /check cross-origin
osprey.check.allowed-origin=https://osprey.ac
# Cloudflare Turnstile (leave disabled for local dev; set the secret and enable in production)
osprey.check.turnstile.enabled=true
osprey.check.turnstile.secret=${TURNSTILE_SECRET:}
osprey.check.turnstile.verify-url=https://challenges.cloudflare.com/turnstile/v0/siteverify
osprey.check.turnstile.timeout-seconds=5
# Per-IP rate limits for the aggregator (one /check fans out to every provider)
osprey.check.rate.burst-capacity=5
osprey.check.rate.burst-window-seconds=20
osprey.check.rate.sustained-capacity=40
osprey.check.rate.sustained-window-seconds=3600
# Hard deadline for a single scan (stragglers past this are reported as failed)
osprey.check.deadline-seconds=12
# ---------------------------------------------
# Multi-tenant auth (self-hosted MSP deployments)
# ---------------------------------------------
# OFF by default: the public deployment serves the extension anonymously and behaves exactly as before.
# A self-hoster serving several client organizations sets this to true to require a per-tenant API key
# on every extension-facing POST /{providerName} request. The public /check and /result endpoints keep
# their existing CORS and Turnstile protection and never require a tenant key.
osprey.tenant.auth.enabled=false
# Request header the extension-facing request must carry the tenant key in. Either the extension is
# configured to send it (via its proxy provider header / remote config) or the trusted Nginx front end
# injects it per client. See docs/self-hosting.md.
osprey.tenant.auth.header=X-Osprey-Tenant-Key
# Path to the tenant key store: a properties file kept OUTSIDE the repo, mode 0600, owned by the service
# user. Re-read automatically when its modification time changes, so keys rotate with no restart. Leave
# blank to configure no store (with auth enabled, that rejects every extension request). See
# docs/tenants.example.properties for the format.
osprey.tenant.store.path=
# Default per-tenant aggregate rate budget, applied to any tenant that does not override it in the store.
# This budget is keyed by tenant alone (across all IPs and providers) so one client cannot exhaust
# another's allowance; the existing per-(provider, IP) buckets are additionally namespaced by tenant.
osprey.tenant.rate.burst-capacity=11
osprey.tenant.rate.burst-window-seconds=1
osprey.tenant.rate.sustained-capacity=400
osprey.tenant.rate.sustained-window-seconds=60
# ---------------------------------------------
# Durable scan store (SQLite)
# ---------------------------------------------
# When enabled, /check writes each aggregate verdict to a local SQLite file keyed by the canonical
# URL (https, no www., query and fragment stripped, path kept). A repeat scan within the freshness
# window is served from the store without contacting any provider; a stale or missing record scans
# live and is saved. Disable to fall back to the stateless, live-only behaviour.
osprey.store.enabled=true
osprey.store.path=/var/lib/osprey/scans.db
osprey.store.busy-timeout-millis=5000
# How long a stored scan is served before a fresh scan is forced (24h)
osprey.store.freshness-seconds=86400
# Retention for non-indexable records. Flagged (phishing/malicious) records are kept regardless;
# clean and soft-signal records older than this are pruned. Set to 0 to disable pruning.
osprey.store.retention.days=90
osprey.store.retention.prune-limit=5000
osprey.store.retention.initial-delay-millis=600000
osprey.store.retention.interval-millis=86400000
# Per-IP rate limit for the read-only /result lookup
osprey.store.result.rate-capacity=30
osprey.store.result.rate-window-seconds=60
# Shared secret required to read GET /internal/index-feed. Leave blank to disable the feed entirely.
# The site build sends it as "Authorization: Bearer <token>".
osprey.store.index-feed.token=${SCAN_FEED_TOKEN:}
osprey.store.index-feed.limit=5000
# ---------------------------------------------
# IndexNow (server-side page announcement)
# ---------------------------------------------
# A scheduled task announces newly hard-flagged (phishing/malicious) page URLs to IndexNow. The key
# must match the key file hosted on the site (https://osprey.ac/<key>.txt). Leave blank to disable.
osprey.indexnow.key=
# Optional; defaults to https://osprey.ac/<key>.txt when left blank
osprey.indexnow.key-location=
osprey.indexnow.submit-url=https://api.indexnow.org/indexnow
osprey.indexnow.batch-limit=10000
osprey.indexnow.timeout-seconds=10
# Wait after startup before the first run, then the gap between runs (default 45 min)
osprey.indexnow.initial-delay-millis=120000
osprey.indexnow.interval-millis=2700000
# ---------------------------------------------
# Resilience4j circuit breaker defaults
# ---------------------------------------------
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=6s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.record-exceptions[0]=java.io.IOException
resilience4j.circuitbreaker.configs.default.record-exceptions[1]=java.net.SocketTimeoutException
resilience4j.circuitbreaker.configs.default.record-exceptions[2]=org.apache.hc.client5.http.ConnectTimeoutException
resilience4j.circuitbreaker.configs.default.record-exceptions[3]=org.apache.hc.core5.http.NoHttpResponseException
# ---------------------------------------------
# Logging config
# ---------------------------------------------
logging.level.org.apache.hc.client5.http=ERROR
logging.level.org.apache.hc.core5=ERROR
logging.level.org.apache.hc.core5.reactor=OFF
logging.level.org.apache.hc.core5.reactor.ssl=OFF
logging.level.org.apache.hc.core5.http.impl.nio=OFF
logging.level.org.apache.hc.core5.http.impl=ERROR
logging.level.org.springframework.web.servlet.PageNotFound=ERROR
logging.level.root=WARN
logging.pattern.console=%d{MMM dd HH:mm:ss} [%level] [%t] %logger{0}: %msg%n

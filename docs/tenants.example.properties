# Example OspreyProxy tenant key store.
#
# Copy this file somewhere OUTSIDE the repository, for example /etc/osprey/tenants.properties, set its
# owner to the service user, and set its mode to 0600 so only that user can read it. Then point
# osprey.tenant.store.path at it and set osprey.tenant.auth.enabled=true.
#
# The proxy re-reads this file automatically whenever its modification time changes, so you can add or
# remove keys and tenants without restarting the process. There is a reload delay of up to one second.
#
# Format, per tenant id:
#   tenant.<id>.keys                          Comma-separated list of one or more API keys for the tenant.
#                                             Listing several keys at once is what enables zero-downtime
#                                             rotation (add the new key, roll it to endpoints, then remove
#                                             the old key).
#   tenant.<id>.rate.burst-capacity           Optional. Overrides osprey.tenant.rate.burst-capacity.
#   tenant.<id>.rate.burst-window-seconds     Optional. Overrides osprey.tenant.rate.burst-window-seconds.
#   tenant.<id>.rate.sustained-capacity       Optional. Overrides osprey.tenant.rate.sustained-capacity.
#   tenant.<id>.rate.sustained-window-seconds Optional. Overrides osprey.tenant.rate.sustained-window-seconds.
#
# The tenant id is an opaque, operator-chosen string. It appears in logs and in the Prometheus "tenant"
# label, so keep it short and free of secrets. Keys are never stored on disk by the proxy and are held
# in memory only as SHA-256 hashes.
#
# Generate a key with, for example:
#   head -c 32 /dev/urandom | base64 | tr -d '/+=' | cut -c1-40
#
# The entries below are commented out and use placeholders on purpose: uncomment them and replace every
# <generated-key> with a freshly generated key, never a value copied from this file.
#
# A tenant that uses the default rate budget.
#tenant.acme.keys=<generated-key>
#
# A tenant mid-rotation (two keys valid at once) with a larger custom budget.
#tenant.globex.keys=<generated-key-1>,<generated-key-2>
#tenant.globex.rate.burst-capacity=25
#tenant.globex.rate.sustained-capacity=1200
